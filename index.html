<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b23"><title>GATE ARMY</title><link rel="stylesheet" href="style.css"></head>
<body><main id="shell"><div id="field"></div><header><div class="brand">GATE <b>ARMY</b><small>TACTICAL RUNNER</small></div><div class="stage">STAGE <b id="stage">01</b><button id="pause" aria-label="一時停止">Ⅱ</button></div></header><section id="stats"><div><small>編成ポイント</small><strong id="points">40</strong></div><div class="unit"><small id="type">歩兵</small><strong id="units">40<span>体</span></strong></div></section><div id="progress"><i></i></div><div id="logistics"></div><div id="intel"></div><div id="toast"></div><div id="bottom"><div id="classes"><span>歩兵 <b>1</b></span><span>対戦車砲兵 <b>3</b></span><span>戦車 <b>10</b></span></div><button id="sound">音 OFF</button></div><div id="overlay"><div class="panel"><span class="eyebrow">BUILD • CHOOSE • BREAK THROUGH</span><h1>GATE<br><em>ARMY</em></h1><p id="message">数か、火力か。<br>ゲートで部隊を増強し、兵種を選んで突破せよ。</p><div class="rules"><span>歩兵 → 砲兵</span><span>砲兵 → 戦車</span><span>戦車 → 歩兵</span></div><p class="fine">兵種変更はコスト換算。余りは保持。<br>射撃は自動。戦闘中は部隊を見守ろう。</p><button id="start">出撃する <span>→</span></button><button id="new-game">NEW GAME / 最初から</button></div></div></main><script type="module" src="game.mjs"></script></body></html>
